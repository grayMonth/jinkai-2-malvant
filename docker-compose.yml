services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: secure-shift-backend
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: secure-shift-frontend
    ports:
      - "3000:3000"
    environment:
      VITE_DATA_SOURCE: api
      VITE_API_BASE_URL: http://localhost:8000
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
